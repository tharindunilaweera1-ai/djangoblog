{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DjangoBlog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>

  <div class="d-flex flex-grow-1 align-items-center">

    <!-- Left side: page links -->
    <div class="navbar-nav flex-row gap-3 ms-3 me-auto">
      <a class="nav-link" href="{% url 'home' %}">Home</a>
      <a class="nav-link" href="{% url 'about' %}">About</a>
      <a class="nav-link" href="{% url 'contact' %}">Contact</a>
    </div>

    <!-- Right side: login state -->
    <div class="d-flex align-items-center gap-2">
  {% if request.user.is_authenticated %}
    <a class="btn btn-outline-light btn-sm" href="{% url 'my_posts' %}">My Posts</a>
    <a class="btn btn-primary btn-sm" href="{% url 'post_create' %}">New Post</a>
    <span class="text-white">Hi, {{ request.user.username }}</span>
    <form method="post" action="{% url 'logout' %}" class="d-inline m-0">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
    </form>
  {% else %}
    <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
    <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Register</a>
  {% endif %}
</div>

  </div>
</nav>
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
