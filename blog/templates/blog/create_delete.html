{% extends "blog/base.html" %}
{% block title %}Delete Post{% endblock %}
{% block content %}

<div class="mx-auto my-5 p-4 text-center"
     style="max-width: 600px; border: 3px solid #dc3545; border-radius: 14px;">

  <h2 class="fw-bold mb-3">Delete this post?</h2>

  <p class="fs-5 mb-1">
    You are about to delete
    <strong>"{{ object.title }}"</strong>.
  </p>
  <p class="text-muted">This action cannot be undone.</p>

  <form method="post" class="d-flex justify-content-center gap-2 mt-4">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'post_detail' object.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </form>

</div>

{% endblock %}
